<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>DÖNNER</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#050505;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
html{scroll-behavior:auto}
body{overflow-x:hidden}
body::-webkit-scrollbar{width:0;height:0}
.track{position:relative;height:780vh;background:#050505}
.stage{position:sticky;top:0;height:100svh;width:100%;overflow:hidden;display:grid;place-items:center;background:#050505}
.frame{position:relative;width:min(100vw,177.7778svh);aspect-ratio:16/10;display:grid;place-items:center;overflow:hidden;background:#050505;transform:translateZ(0)}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#050505;transform:translateZ(0);backface-visibility:hidden}
.loader{position:fixed;z-index:20;inset:0;background:#050505;display:grid;place-items:center;transition:opacity .4s ease}
.loader.hide{opacity:0;pointer-events:none}
.loader span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#ffffff88}
.loader span:after{content:"";display:block;width:42px;height:1px;margin:14px auto 0;background:#ff2638;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scaleX(.35);opacity:.4}}
.hint{position:fixed;z-index:10;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#ffffff66;pointer-events:none;transition:opacity .25s}
.progress{position:fixed;z-index:12;top:0;left:0;width:0;height:2px;background:#ff2438;box-shadow:0 0 12px #ff243888;pointer-events:none}
@media(max-width:700px){
  .track{height:700vh}
  .stage{place-items:center}
  .frame{width:100vw;aspect-ratio:16/10}
}
</style>
</head>
<body>
<div class="track" id="track">
  <div class="stage">
    <div class="frame"><video id="scrub" muted playsinline preload="auto"></video></div>
  </div>
</div>
<div class="progress" id="progress"></div>
<div class="hint" id="hint">scroll / swipe</div>
<div class="loader" id="loader"><span>DÖNNER</span></div>
<script>
(async()=>{
  const files=[
    "asset0.b64","asset1.b64","asset2.b64",
    "p3_0.b64","p3_1.b64","p3_2.b64","p3_3.b64","p3_4.b64","p3_5.b64","p3_6.b64",
    "p4_0.b64","p4_1.b64","p4_2.b64","p4_3.b64","p4_4.b64","p4_5.b64"
  ];
  const video=document.getElementById("scrub");
  const track=document.getElementById("track");
  const progress=document.getElementById("progress");
  const loader=document.getElementById("loader");
  const hint=document.getElementById("hint");

  try{
    const parts=await Promise.all(files.map(async file=>{
      const r=await fetch(file,{cache:"force-cache"});
      if(!r.ok) throw new Error(file);
      return (await r.text()).trim();
    }));
    const b64=parts.join("");
    const binary=atob(b64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    video.src=URL.createObjectURL(new Blob([bytes],{type:"video/mp4"}));
  }catch(e){
    loader.querySelector("span").textContent="Reload";
    return;
  }

  let target=0,current=0,duration=7.46,ready=false,lastSet=-1;

  function measure(){
    const rect=track.getBoundingClientRect();
    const max=Math.max(1,track.offsetHeight-innerHeight);
    target=Math.max(0,Math.min(1,-rect.top/max));
    progress.style.width=(target*100)+"%";
    hint.style.opacity=Math.max(0,1-target*20);
  }

  function render(){
    current+=(target-current)*.34;
    if(ready){
      const t=Math.max(0.001,Math.min(duration-.025,current*duration));
      if(Math.abs(t-lastSet)>.012){
        try{ video.currentTime=t; lastSet=t; }catch(e){}
      }
    }
    requestAnimationFrame(render);
  }

  video.addEventListener("loadedmetadata",()=>{
    duration=Number.isFinite(video.duration)?video.duration:duration;
    ready=true;
    try{video.currentTime=.001}catch(e){}
    loader.classList.add("hide");
  },{once:true});

  // iOS Safari allows fast seeking more reliably after one user gesture.
  const unlock=()=>{
    const p=video.play();
    if(p&&p.then) p.then(()=>{video.pause();}).catch(()=>{});
  };
  addEventListener("touchstart",unlock,{passive:true,once:true});
  addEventListener("pointerdown",unlock,{passive:true,once:true});

  addEventListener("scroll",measure,{passive:true});
  addEventListener("resize",measure,{passive:true});
  measure();
  render();
})();
</script>
</body>
</html>
